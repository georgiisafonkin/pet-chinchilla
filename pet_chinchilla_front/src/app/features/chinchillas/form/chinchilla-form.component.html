<div class="form-page">
    <div class="form-container">
      <div class="form-header">
        <button mat-icon-button routerLink="/chinchillas" matTooltip="Back">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="form-title">
          {{ isEditMode ? 'Edit Chinchilla' : 'Add Chinchilla' }}
        </h1>
      </div>
  
      <div class="alert-error" *ngIf="error">{{ error }}</div>
  
      <div class="loading-container" *ngIf="loading">
        <mat-spinner diameter="48"></mat-spinner>
      </div>
  
      <form (ngSubmit)="onSubmit()" *ngIf="!loading">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name *</mat-label>
          <mat-icon matPrefix>pets</mat-icon>
          <input matInput [(ngModel)]="name" name="name" placeholder="Enter name"/>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Age (months)</mat-label>
          <mat-icon matPrefix>cake</mat-icon>
          <input matInput type="number" [(ngModel)]="age" name="age" placeholder="Enter age"/>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Breed</mat-label>
          <mat-icon matPrefix>category</mat-icon>
          <input matInput [(ngModel)]="breed" name="breed" placeholder="Enter breed"/>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fur type</mat-label>
          <mat-icon matPrefix>brush</mat-icon>
          <mat-select [(ngModel)]="fur_type" name="fur_type">
            <mat-option value="">— Not specified —</mat-option>
            <mat-option *ngFor="let type of furTypes" [value]="type">
              {{ type }}
            </mat-option>
          </mat-select>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Color</mat-label>
          <mat-icon matPrefix>palette</mat-icon>
          <input matInput [(ngModel)]="color" name="color" placeholder="Enter color"/>
        </mat-form-field>
  
        <div class="form-actions">
          <a mat-stroked-button routerLink="/chinchillas">Cancel</a>
          <button mat-raised-button class="btn-gradient" type="submit" [disabled]="saving">
            <mat-spinner diameter="20" *ngIf="saving"></mat-spinner>
            <span *ngIf="!saving">
              {{ isEditMode ? 'Save changes' : 'Add chinchilla' }}
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
