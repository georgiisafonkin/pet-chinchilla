<div class="container">
    <div class="header">
      <h2>My Chinchillas</h2>
      <a routerLink="/chinchillas/new">+ Add Chinchilla</a>
    </div>
  
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="loading" *ngIf="loading">Loading...</div>
  
    <div *ngIf="!loading && chinchillas.length === 0">
      <p>You have no chinchillas yet. Add your first one!</p>
    </div>
  
    <div class="list" *ngIf="!loading && chinchillas.length > 0">
      <div class="card" *ngFor="let c of chinchillas">
        <h3>{{ c.name }}</h3>
        <p *ngIf="c.age">Age: {{ c.age }} months</p>
        <p *ngIf="c.breed">Breed: {{ c.breed }}</p>
        <p *ngIf="c.fur_type">Fur type: {{ c.fur_type }}</p>
        <p *ngIf="c.color">Color: {{ c.color }}</p>
        <div class="actions">
          <a [routerLink]="['/chinchillas', c.id, 'edit']">Edit</a>
          <button (click)="delete(c.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>
